<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Оплата рахунку за IBAN</title>
  
  <!-- Мета-теги для красивого прев'ю у Viber / Telegram -->
  <meta property="og:title" content="Оплата рахунку за IBAN (НБУ)">
  <meta property="og:description" content="Швидка та безпечна оплата через мобільний додаток вашого банку">
  <meta property="og:image" content="QROSYPAY_ICON.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="QROSYPAY_ICON.png">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px 12px;
      line-height: 1.45;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 840px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
      margin: auto 0;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        margin: 0;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Блок суми */
    .amount-box {
      background: #f1f5f9;
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }
    .amount-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .amount-val {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      margin-top: 2px;
    }

    /* Список реквізитів */
    .requisites-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .req-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: #f8fafc;
      border: 1px solid var(--border);
      gap: 8px;
    }
    .req-info {
      flex: 1;
      min-width: 0;
    }
    .req-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .req-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }
    .btn-copy {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .btn-copy:active {
      background: #e2e8f0;
    }

    /* Кнопки оплати */
    .btn-main-pay {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
      transition: background 0.15s, transform 0.08s;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-main-pay:active {
      transform: scale(0.98);
      background: var(--primary-hover);
    }

    /* Банки */
    .banks-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      position: relative;
    }
    .banks-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .bank-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .bank-btn:active {
      background: #f1f5f9;
    }
    .bank-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }

    /* QR Картка */
    .qr-card {
      text-align: center;
      justify-content: center;
    }
    .qr-box {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      margin: 10px auto;
      padding: 10px;
      background: #fff;
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-box canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Ліва колонка: Деталі чека та вибір оплати -->
  <div class="card">
    <div class="amount-box">
      <div class="amount-label">Сума до сплати:</div>
      <div class="amount-val" id="disp-amount">0 ₴</div>
    </div>

    <div class="requisites-list">
      <div class="req-item">
        <div class="req-info">
          <div class="req-label">Отримувач</div>
          <div class="req-val" id="disp-recipient">—</div>
        </div>
        <button class="btn-copy" onclick="copyVal('disp-recipient')" title="Скопіювати">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
      </div>

      <div class="req-item">
        <div class="req-info">
          <div class="req-label">Рахунок IBAN</div>
          <div class="req-val" id="disp-iban" style="font-family:monospace;">—</div>
        </div>
        <button class="btn-copy" onclick="copyVal('disp-iban')" title="Скопіювати">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
      </div>

      <div class="req-item">
        <div class="req-info">
          <div class="req-label">ЄДРПОУ / РНОКПП</div>
          <div class="req-val" id="disp-taxid">—</div>
        </div>
        <button class="btn-copy" onclick="copyVal('disp-taxid')" title="Скопіювати">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
      </div>

      <div class="req-item">
        <div class="req-info">
          <div class="req-label">Призначення платежу</div>
          <div class="req-val" id="disp-purpose">—</div>
        </div>
        <button class="btn-copy" onclick="copyVal('disp-purpose')" title="Скопіювати">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
      </div>
    </div>

    <!-- Головна кнопка виклику системного вікна банку -->
    <a id="btn-pay-link" href="#" class="btn-main-pay">Оплатити в додатку банку</a>

    <!-- Прямі переходи у популярні українські банки -->
    <div class="banks-title">Або оберіть додаток:</div>
    <div class="banks-grid">
      <a id="link-mono" href="#" class="bank-btn">
        <div class="bank-icon" style="background:#000;">M</div>
        <span>monobank</span>
      </a>
      <a id="link-privat" href="#" class="bank-btn">
        <div class="bank-icon" style="background:#70a800;">24</div>
        <span>Приват24</span>
      </a>
      <a id="link-abank" href="#" class="bank-btn">
        <div class="bank-icon" style="background:#009a49;">a</div>
        <span>А-Банк</span>
      </a>
      <a id="link-pumb" href="#" class="bank-btn">
        <div class="bank-icon" style="background:#be123c;">П</div>
        <span>ПУМБ</span>
      </a>
      <a id="link-sense" href="#" class="bank-btn">
        <div class="bank-icon" style="background:#0284c7;">S</div>
        <span>Sense Bank</span>
      </a>
      <a id="link-ukrgas" href="#" class="bank-btn">
        <div class="bank-icon" style="background:#16a34a;">U</div>
        <span>Укргазбанк</span>
      </a>
    </div>
  </div>

  <!-- Права колонка: QR для оплати (зручно на ПК / для сканування іншим телефоном) -->
  <div class="card qr-card">
    <div style="font-weight:700; font-size:16px;">Скануйте QR-код</div>
    <div style="font-size:12px; color:var(--text-muted);">Відкрийте камеру або сканер у додатку банку</div>
    
    <div class="qr-box" id="qr-container"></div>
    
    <div style="font-size:11px; color:#94a3b8;">
      Офіційний стандарт платежів НБУ (UCT)
    </div>
  </div>
</div>

<script>
  // Надійне декодування URL-Safe Base64 з підтримкою кирилиці (UTF-8)
  function decodeBase64UrlSafe(str) {
    // Прибираємо можливі пробіли або URL-символи
    str = decodeURIComponent(str).trim();
    // Повертаємо стандартні символи Base64 замість URL-безпечних
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    // Додаємо падінг = до кратності 4
    while (str.length % 4) {
      str += '=';
    }
    
    // Декодуємо бінарні байти
    const binary = atob(str);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    
    // Перетворюємо байти UTF-8 у повноцінний український текст
    return new TextDecoder('utf-8').decode(bytes);
  }

  function copyVal(id) {
    const text = document.getElementById(id).textContent;
    if (!text || text === "—") return;
    navigator.clipboard.writeText(text).then(() => {
      alert("Скопійовано: " + text);
    });
  }

  window.addEventListener("DOMContentLoaded", () => {
    // Читаємо хеш або query параметр
    let raw = window.location.hash ? window.location.hash.substring(1) : "";
    if (!raw && window.location.search) {
      raw = window.location.search.substring(1);
    }

    if (!raw) {
      document.body.innerHTML = "<div style='text-align:center; padding:50px;'><h3>Посилання не містить платіжних даних</h3></div>";
      return;
    }

    try {
      const decoded = decodeBase64UrlSafe(raw);
      const lines = decoded.split("\n");

      // Парсимо стандарт НБУ UCT
      const recipient = lines[5] || "—";
      const iban = (lines[6] || "—").replace(/\s+/g, "");
      const amountRaw = (lines[7] || "").trim();
      const taxId = lines[8] || "—";
      const purpose = lines[11] || "—";

      let displayAmount = "Довільна";
      if (amountRaw.startsWith("UAH")) {
        displayAmount = amountRaw.replace("UAH", "") + " ₴";
      } else if (amountRaw && !isNaN(parseFloat(amountRaw))) {
        displayAmount = amountRaw + " ₴";
      }

      document.getElementById("disp-amount").textContent = displayAmount;
      document.getElementById("disp-recipient").textContent = recipient;
      document.getElementById("disp-iban").textContent = iban;
      document.getElementById("disp-taxid").textContent = taxId;
      document.getElementById("disp-purpose").textContent = purpose;

      // Офіційне посилання НБУ для банківських застосунків
      const nbuUniversalLink = "https://bank.gov.ua/qr/" + raw;
      document.getElementById("btn-pay-link").href = nbuUniversalLink;

      // Deep Links під банки
      document.getElementById("link-mono").href = "monobank://qr/" + raw;
      document.getElementById("link-privat").href = nbuUniversalLink;
      document.getElementById("link-abank").href = nbuUniversalLink;
      document.getElementById("link-pumb").href = nbuUniversalLink;
      document.getElementById("link-sense").href = nbuUniversalLink;
      document.getElementById("link-ukrgas").href = nbuUniversalLink;

      // Генерація QR-коду
      const qr = qrcode(0, 'M');
      qr.addData(nbuUniversalLink);
      qr.make();

      const count = qr.getModuleCount();
      const cell = 5;
      const margin = 10;
      const size = count * cell + margin * 2;

      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);

      ctx.fillStyle = "#0f172a";
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillRect(margin + c * cell, margin + r * cell, cell, cell);
          }
        }
      }

      const container = document.getElementById("qr-container");
      container.innerHTML = "";
      container.appendChild(canvas);

    } catch (err) {
      console.error("Помилка парсингу або генерації:", err);
      document.body.innerHTML = `
        <div style='text-align:center; padding:50px; color:#b91c1c;'>
          <h3>Помилка розпізнавання платіжних реквізитів</h3>
          <p style='font-size:12px; color:#64748b; margin-top:8px;'>Деталі: ${err.message || err}</p>
        </div>
      `;
    }
  });
</script>

</body>
